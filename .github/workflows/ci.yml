name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The RFC proof (build, vet, golangci-lint, race tests with at least 95%
  # coverage, the checklist and 30 seconds of each fuzz target) is go-spf's
  # reviewed workflow, pinned to one commit. Lines left uncovered on purpose
  # are listed, with reasons, in COVERAGE.md.
  rfc:
    name: Verify RFC
    uses: rest-mail/go-spf/.github/workflows/rfc-verification.yml@7d291c08d310b9c62afc287e75a534a39150fafb
    with:
      packages: '["./..."]'
      checklist-dirs: '["."]'
      fuzz-targets: >-
        [{"package":".","target":"FuzzParsePolicy"},
         {"package":".","target":"FuzzParseTXTRecord"},
         {"package":".","target":"FuzzMatchesMX"}]

  fixtures:
    name: Workflow fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/tests -v

  # Preserve the existing required context. Skipped/cancelled proof jobs must
  # never produce a successful Build & Test verdict.
  build:
    name: Build & Test
    needs: [rfc, fixtures]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RFC_RESULT: ${{ needs.rfc.result }}
          FIXTURE_RESULT: ${{ needs.fixtures.result }}
        run: test "$RFC_RESULT" = success && test "$FIXTURE_RESULT" = success
